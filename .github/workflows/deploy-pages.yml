name: Deploy Podcast Feed to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'episodes/feed.xml'
      - 'pages/**'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp episodes/feed.xml _site/feed.xml
          # -r so pages/transcripts/ (and any future subdirs) are included.
          cp -r pages/. _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
