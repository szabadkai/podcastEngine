name: Generate Weekly Episode

on:
  schedule:
    - cron: '17 1 * * 5' # Every Friday at 1:17 AM UTC / 3:17 AM Budapest summer time
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Episode date (YYYY-MM-DD), leave empty for today'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip audio + publish)'
        required: false
        type: boolean
        default: false
      episode_type:
        description: 'Episode type'
        required: false
        type: choice
        default: news
        options:
          - news
          - company-profile
      company_name:
        description: 'Company name when episode_type is company-profile'
        required: false
        type: string
      company_website:
        description: 'Optional official company homepage to crawl for profile pages'
        required: false
        type: string
      company_profile_urls:
        description: 'Optional comma/newline-separated official, product, leadership, or background URLs'
        required: false
        type: string

concurrency:
  group: podcast-generation
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  EPISODE_TYPE: ${{ inputs.episode_type || 'news' }}
  COMPANY_NAME: ${{ inputs.company_name }}
  COMPANY_WEBSITE: ${{ inputs.company_website }}
  COMPANY_PROFILE_URLS: ${{ inputs.company_profile_urls }}

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      # Needed to dispatch the deploy-pages workflow after pushing the feed.
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Preflight scheduled episode
        id: preflight
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: |
          episode_date="$(
            TARGET_WEEKDAY=5 node --input-type=module <<'NODE'
          const override = process.env.EPISODE_DATE?.trim();
          if (override) {
            console.log(override);
            process.exit(0);
          }

          const now = new Date();
          if (process.env.GITHUB_EVENT_NAME === "schedule") {
            const targetWeekday = Number(process.env.TARGET_WEEKDAY);
            const daysSinceTarget = (now.getUTCDay() - targetWeekday + 7) % 7;
            now.setUTCDate(now.getUTCDate() - daysSinceTarget);
          }

          console.log(now.toISOString().slice(0, 10));
          NODE
          )"
          echo "episode_date=$episode_date" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if EPISODE_DATE="$episode_date" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const manifestPath = "episodes/manifest.json";
          const episodeDate = process.env.EPISODE_DATE;
          let manifest = { episodes: [] };

          try {
            manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          } catch {
            // Missing or unreadable manifest means there is nothing to skip yet.
          }

          const alreadyPublished = Array.isArray(manifest.episodes)
            && manifest.episodes.some((episode) => episode.date === episodeDate);

          process.exit(alreadyPublished ? 0 : 1);
          NODE
            then
              echo "Episode $episode_date is already in the manifest; skipping delayed scheduled run."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

      # ffmpeg + ffprobe are needed by the audio stage to concat + loudnorm the
      # TTS chunks. Install from the Ubuntu repos rather than a downloader action:
      # FedericoCarboni/setup-ffmpeg pulls static Linux builds from johnvansickle.com,
      # which intermittently fails the whole job with "Failed to get latest
      # johnvansickle ffmpeg release" when that site's release listing changes or
      # is unreachable. The apt package ships libmp3lame + loudnorm + ffprobe,
      # which is everything src/lib/audio.ts uses.
      - name: Install ffmpeg
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # TTS provider is "elevenlabs" (see config.ts) — a hosted API, so no local
      # TTS engine to install. It only needs ELEVENLABS_API_KEY (set as a secret).
      - if: ${{ steps.preflight.outputs.should_run == 'true' }}
        run: npm ci

      - name: Collect stories
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts collect

      - name: Analyze stories
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
        run: npx tsx src/pipeline.ts analyze

      - name: Fact-check stories
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
        run: npx tsx src/pipeline.ts fact-check

      - name: Generate script
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
        run: npx tsx src/pipeline.ts script

      - name: Add expressive tags
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
        run: npx tsx src/pipeline.ts tag

      - name: Distill continuity recap
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
        run: npx tsx src/pipeline.ts recap

      - name: Generate audio
        if: ${{ steps.preflight.outputs.should_run == 'true' && !inputs.dry_run }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
        run: npx tsx src/pipeline.ts audio

      - name: Publish episode
        if: ${{ steps.preflight.outputs.should_run == 'true' && !inputs.dry_run }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts publish

      - name: Commit state changes
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        id: commit
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
        run: |
          git config user.name "Podcast Bot"
          git config user.email "bot@podcast.dev"
          # Only the feed, manifest, recaps, transcripts, and seen-urls are
          # committed. The MP3 and intermediate JSON live in the GitHub Release.
          # Use --ignore-errors so a dry run (no manifest/feed yet) or a first-ever
          # run doesn't abort on a not-yet-created pathspec.
          git add --ignore-errors data/ episodes/manifest.json episodes/feed.xml episodes/recaps/ pages/transcripts/ || true
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Episode ${EPISODE_DATE}"
            for attempt in 1 2 3; do
              if git push; then
                echo "committed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push raced with another update; rebasing before retry ${attempt}/3..."
              git pull --rebase origin main
            done
            echo "Unable to push episode state after three attempts." >&2
            exit 1
          fi

      # A push made with the default GITHUB_TOKEN does NOT trigger other
      # workflows (GitHub blocks this to avoid recursive runs), so the
      # deploy-pages "push" trigger never fires for the bot's feed.xml commit
      # and the new feed never reaches GitHub Pages / the distributors.
      # workflow_dispatch is exempt from that rule, so kick the deploy
      # explicitly once the new feed has been pushed.
      - name: Trigger Pages deploy
        if: ${{ !inputs.dry_run && steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
