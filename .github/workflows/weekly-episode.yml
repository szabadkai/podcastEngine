name: Generate Weekly Episode

on:
  schedule:
    - cron: '0 6 * * 5' # Every Friday at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Episode date (YYYY-MM-DD), leave empty for today'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip audio + publish)'
        required: false
        type: boolean
        default: false

concurrency:
  group: podcast-generation
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # ffmpeg is needed by the audio stage to concat + loudnorm the TTS chunks.
      - uses: FedericoCarboni/setup-ffmpeg@v3.1

      # TTS provider is "elevenlabs" (see config.ts) — a hosted API, so no local
      # TTS engine to install. It only needs ELEVENLABS_API_KEY (set as a secret).
      - run: npm ci

      - name: Collect stories
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts collect

      - name: Analyze stories
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts analyze

      - name: Fact-check stories
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts fact-check

      - name: Generate script
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts script

      - name: Add expressive tags
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts tag

      - name: Distill continuity recap
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts recap

      - name: Generate audio
        if: ${{ !inputs.dry_run }}
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts audio

      - name: Publish episode
        if: ${{ !inputs.dry_run }}
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts publish

      - name: Commit state changes
        run: |
          git config user.name "Podcast Bot"
          git config user.email "bot@podcast.dev"
          # Committed: the feed, manifest, recaps, seen-urls, and the Pages
          # payload (pages/episodes/*.mp3 + pages/transcripts/*.txt) that the feed
          # links to. The intermediate JSON artifacts live in the GitHub Release
          # (see .gitignore). The MP3 is served from Pages so Apple Podcasts
          # accepts it (audio/mpeg, inline) rather than as an octet-stream
          # attachment from the Release download URL.
          # Use --ignore-errors so a dry run (no manifest/feed yet) or a first-ever
          # run doesn't abort on a not-yet-created pathspec.
          git add --ignore-errors data/ episodes/manifest.json episodes/feed.xml episodes/recaps/ pages/episodes/ pages/transcripts/ || true
          git diff --staged --quiet || git commit -m "Episode $(date +%Y-%m-%d)"
          git push
