name: Generate Weekly Episode

on:
  schedule:
    - cron: '0 6 * * 5' # Every Friday at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Episode date (YYYY-MM-DD), leave empty for today'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip audio + publish)'
        required: false
        type: boolean
        default: false

concurrency:
  group: podcast-generation
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install edge-tts (TTS engine for the audio stage)
        if: ${{ !inputs.dry_run }}
        run: pipx install edge-tts

      - run: npm ci

      - name: Collect stories
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts collect

      - name: Analyze stories
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts analyze

      - name: Fact-check stories
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts fact-check

      - name: Generate script
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts script

      - name: Add expressive tags
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts tag

      - name: Distill continuity recap
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts recap

      - name: Generate audio
        if: ${{ !inputs.dry_run }}
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: npx tsx src/pipeline.ts audio

      - name: Publish episode
        if: ${{ !inputs.dry_run }}
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts publish

      - name: Commit state changes
        run: |
          git config user.name "Layer Lines Bot"
          git config user.email "bot@layerlines.dev"
          # Only the feed, manifest, recaps, and seen-urls are committed. The MP3
          # and intermediate JSON live in the GitHub Release (see .gitignore).
          git add data/ episodes/manifest.json episodes/feed.xml episodes/recaps/
          git diff --staged --quiet || git commit -m "Episode $(date +%Y-%m-%d)"
          git push
