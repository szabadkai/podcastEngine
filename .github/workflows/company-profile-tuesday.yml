name: Generate Company Profile Tuesday

on:
  schedule:
    - cron: '0 6 * * 2' # Every Tuesday at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Episode date (YYYY-MM-DD), leave empty for today'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip audio + publish)'
        required: false
        type: boolean
        default: false
      company_name:
        description: 'Optional company name override; otherwise the queue is used'
        required: false
        type: string
      company_website:
        description: 'Optional official company homepage override'
        required: false
        type: string
      company_profile_urls:
        description: 'Optional comma/newline-separated profile URLs override'
        required: false
        type: string

concurrency:
  group: podcast-generation
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  generate-company-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - run: npm ci

      - name: Select company profile
        env:
          MANUAL_COMPANY_NAME: ${{ inputs.company_name }}
          MANUAL_COMPANY_WEBSITE: ${{ inputs.company_website }}
          MANUAL_COMPANY_PROFILE_URLS: ${{ inputs.company_profile_urls }}
        run: npx tsx scripts/select-company-profile.ts

      - name: Stop if queue is empty
        if: ${{ env.COMPANY_PROFILE_SELECTED != 'true' }}
        run: echo "No company profile selected. Add enabled entries to data/company-profile-queue.json."

      - name: Collect company research
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
          COMPANY_WEBSITE: ${{ env.SELECTED_COMPANY_WEBSITE }}
          COMPANY_PROFILE_URLS: ${{ env.SELECTED_COMPANY_PROFILE_URLS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts collect

      - name: Analyze company profile
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts analyze

      - name: Fact-check company profile
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts fact-check

      - name: Generate script
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts script

      - name: Add expressive tags
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts tag

      - name: Distill continuity recap
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts recap

      - name: Generate audio
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts audio

      - name: Publish episode
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts publish

      - name: Mark company profile complete
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run }}
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx scripts/select-company-profile.ts --mark-complete

      - name: Commit state changes
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run }}
        id: commit
        run: |
          git config user.name "Podcast Bot"
          git config user.email "bot@podcast.dev"
          git add --ignore-errors data/ episodes/manifest.json episodes/feed.xml episodes/recaps/ pages/transcripts/ || true
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Company profile: ${SELECTED_COMPANY_NAME} ($(date +%Y-%m-%d))"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run && steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
