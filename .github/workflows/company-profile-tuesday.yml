name: Generate Company Profile Tuesday

on:
  schedule:
    - cron: '17 1 * * 2' # Every Tuesday at 1:17 AM UTC / 3:17 AM Budapest summer time
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Episode date (YYYY-MM-DD), leave empty for today'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip audio + publish)'
        required: false
        type: boolean
        default: false
      company_name:
        description: 'Optional company name override; otherwise the queue is used'
        required: false
        type: string
      company_website:
        description: 'Optional official company homepage override'
        required: false
        type: string
      company_profile_urls:
        description: 'Optional comma/newline-separated profile URLs override'
        required: false
        type: string

concurrency:
  group: podcast-generation
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

jobs:
  generate-company-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Preflight scheduled episode
        id: preflight
        env:
          EPISODE_DATE: ${{ inputs.date_override }}
        run: |
          episode_date="$(
            TARGET_WEEKDAY=2 node --input-type=module <<'NODE'
          const override = process.env.EPISODE_DATE?.trim();
          if (override) {
            console.log(override);
            process.exit(0);
          }

          const now = new Date();
          if (process.env.GITHUB_EVENT_NAME === "schedule") {
            const targetWeekday = Number(process.env.TARGET_WEEKDAY);
            const daysSinceTarget = (now.getUTCDay() - targetWeekday + 7) % 7;
            now.setUTCDate(now.getUTCDate() - daysSinceTarget);
          }

          console.log(now.toISOString().slice(0, 10));
          NODE
          )"
          echo "episode_date=$episode_date" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if EPISODE_DATE="$episode_date" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const manifestPath = "episodes/manifest.json";
          const episodeDate = process.env.EPISODE_DATE;
          let manifest = { episodes: [] };

          try {
            manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          } catch {
            // Missing or unreadable manifest means there is nothing to skip yet.
          }

          const alreadyPublished = Array.isArray(manifest.episodes)
            && manifest.episodes.some((episode) => episode.date === episodeDate);

          process.exit(alreadyPublished ? 0 : 1);
          NODE
            then
              echo "Episode $episode_date is already in the manifest; skipping delayed scheduled run."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - if: ${{ steps.preflight.outputs.should_run == 'true' }}
        run: npm ci

      - name: Select company profile
        if: ${{ steps.preflight.outputs.should_run == 'true' }}
        env:
          MANUAL_COMPANY_NAME: ${{ inputs.company_name }}
          MANUAL_COMPANY_WEBSITE: ${{ inputs.company_website }}
          MANUAL_COMPANY_PROFILE_URLS: ${{ inputs.company_profile_urls }}
        run: npx tsx scripts/select-company-profile.ts

      - name: Stop if queue is empty
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED != 'true' }}
        run: echo "No company profile selected. Add enabled entries to data/company-profile-queue.json."

      - name: Collect company research
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
          COMPANY_WEBSITE: ${{ env.SELECTED_COMPANY_WEBSITE }}
          COMPANY_PROFILE_URLS: ${{ env.SELECTED_COMPANY_PROFILE_URLS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts collect

      - name: Analyze company profile
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts analyze

      - name: Fact-check company profile
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts fact-check

      - name: Generate script
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts script

      - name: Add expressive tags
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts tag

      - name: Distill continuity recap
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts recap

      - name: Generate audio
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx src/pipeline.ts audio

      - name: Publish episode
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run }}
        env:
          EPISODE_TYPE: company-profile
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/pipeline.ts publish

      - name: Mark company profile complete
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run }}
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
          COMPANY_NAME: ${{ env.SELECTED_COMPANY_NAME }}
        run: npx tsx scripts/select-company-profile.ts --mark-complete

      - name: Commit state changes
        if: ${{ steps.preflight.outputs.should_run == 'true' && env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run }}
        id: commit
        env:
          EPISODE_DATE: ${{ steps.preflight.outputs.episode_date }}
        run: |
          git config user.name "Podcast Bot"
          git config user.email "bot@podcast.dev"
          git add --ignore-errors data/ episodes/manifest.json episodes/feed.xml episodes/recaps/ pages/transcripts/ || true
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Company profile: ${SELECTED_COMPANY_NAME} (${EPISODE_DATE})"
            for attempt in 1 2 3; do
              if git push; then
                echo "committed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Push raced with another update; rebasing before retry ${attempt}/3..."
              git pull --rebase origin main
            done
            echo "Unable to push episode state after three attempts." >&2
            exit 1
          fi

      - name: Trigger Pages deploy
        if: ${{ env.COMPANY_PROFILE_SELECTED == 'true' && !inputs.dry_run && steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
